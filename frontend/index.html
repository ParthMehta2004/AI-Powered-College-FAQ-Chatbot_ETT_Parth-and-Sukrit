<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUJ Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080e1a;
            --bg-card: #0d1628;
            --bg-input: #111e33;
            --bg-msg-ai: #0f1e35;
            --bg-msg-you: #1e3a6e;
            --accent: #5b7fff;
            --accent2: #7c9dff;
            --border: rgba(91, 127, 255, 0.18);
            --text: #e8edf8;
            --text-muted: #6b7fa3;
            --success: #4ade80;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 60% 40% at 20% 20%, rgba(91, 127, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 40% 60% at 80% 80%, rgba(124, 157, 255, 0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            background: rgba(13, 22, 40, 0.95);
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }
        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(91, 127, 255, 0.3);
        }
        .logo-text { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
        .logo-text span { color: var(--accent2); }
        .status-pill {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #f59e0b;
            animation: pulse 2s infinite;
        }
        .status-dot.ready { background: var(--success); animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
            scroll-behavior: smooth;
        }
        #chat-area::-webkit-scrollbar { width: 4px; }
        #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        #welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 16px;
            text-align: center;
            padding: 40px 20px;
        }
        .welcome-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, rgba(91, 127, 255, 0.2), rgba(124, 157, 255, 0.1));
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 8px;
        }
        .suggestion-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
        .chip {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover { border-color: var(--accent); color: var(--accent2); background: rgba(91, 127, 255, 0.08); }
        .message { display: flex; gap: 10px; max-width: 780px; width: 100%; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { margin-left: auto; flex-direction: row-reverse; }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .message.ai .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
        .bubble { padding: 12px 16px; border-radius: var(--radius); font-size: 0.88rem; line-height: 1.65; max-width: calc(100% - 44px); }
        .message.ai .bubble { background: var(--bg-msg-ai); border: 1px solid var(--border); border-top-left-radius: 4px; }
        .message.user .bubble { background: var(--bg-msg-you); border: 1px solid rgba(91, 127, 255, 0.25); border-top-right-radius: 4px; }
        #input-area {
            padding: 16px 20px 20px;
            border-top: 1px solid var(--border);
            background: rgba(13, 22, 40, 0.97);
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 10;
        }
        .input-wrapper {
            max-width: 780px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 10px 10px 16px;
        }
        #user-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: inherit;
            font-size: 0.88rem;
            resize: none;
            max-height: 120px;
        }
        #send-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #send-btn svg { width: 16px; height: 16px; fill: white; }
    </style>
</head>
<body>
    <header>
        <div class="logo-icon">M</div>
        <div class="logo-text">MUJ <span>Chat</span></div>
        <div class="status-pill">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Connecting...</span>
        </div>
    </header>
    <div id="chat-area">
        <div id="welcome">
            <div class="welcome-icon">🎓</div>
            <h2>Welcome to <span>MUJ Chat</span></h2>
            <p>Your AI assistant for Manipal University Jaipur.</p>
            <div class="suggestion-chips">
                <button class="chip" onclick="useChip(this)">Course structure</button>
                <button class="chip" onclick="useChip(this)">Admission process</button>
            </div>
        </div>
    </div>
    <div id="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="Ask anything about MUJ..." rows="1"></textarea>
            <button id="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>
    <script>
        const textarea = document.getElementById('user-input');
        function useChip(btn) { textarea.value = btn.textContent; textarea.focus(); }
        async function sendMessage() {
            const question = textarea.value.trim();
            if(!question) return;
            textarea.value = '';
            addMessage('user', question);
            try {
                const res = await fetch(`/ask?question=${encodeURIComponent(question)}`, { method: 'POST' });
                const data = await res.json();
                addMessage('ai', data.answer);
            } catch { addMessage('ai', 'Error connecting to server.'); }
        }
        function addMessage(role, content) {
            const area = document.getElementById('chat-area');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="avatar">${role === 'ai' ? 'M' : 'U'}</div><div class="bubble">${content}</div>`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }
        async function checkStatus() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                if(data.status === 'loaded') {
                    document.getElementById('status-dot').classList.add('ready');
                    document.getElementById('status-text').textContent = 'Ready';
                }
            } catch {}
        }
        checkStatus();
    </script>
</body>
</html>
