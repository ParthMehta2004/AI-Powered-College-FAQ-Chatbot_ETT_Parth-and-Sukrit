<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUJ Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:    #080e1a;
    --bg-card:    #0d1628;
    --bg-input:   #111e33;
    --bg-msg-ai:  #0f1e35;
    --bg-msg-you: #1e3a6e;
    --accent:     #5b7fff;
    --accent2:    #7c9dff;
    --border:     rgba(91,127,255,0.18);
    --text:       #e8edf8;
    --text-muted: #6b7fa3;
    --success:    #4ade80;
    --radius:     16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Sora',sans-serif;
    background:var(--bg-deep);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%,rgba(91,127,255,.08) 0%,transparent 60%),
      radial-gradient(ellipse 40% 60% at 80% 80%,rgba(124,157,255,.06) 0%,transparent 60%);
    pointer-events:none; z-index:0;
  }
  header {
    display:flex; align-items:center; gap:12px;
    padding:16px 28px;
    border-bottom:1px solid var(--border);
    background:rgba(13,22,40,.95);
    backdrop-filter:blur(12px);
    position:relative; z-index:10; flex-shrink:0;
  }
  .logo-icon {
    width:38px; height:38px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:18px; box-shadow:0 0 20px rgba(91,127,255,.3);
  }
  .logo-text { font-size:1.25rem; font-weight:700; letter-spacing:-.02em; }
  .logo-text span { color:var(--accent2); }
  .status-pill {
    margin-left:auto; display:flex; align-items:center; gap:6px;
    font-size:.75rem; color:var(--text-muted);
    background:var(--bg-input); padding:5px 12px;
    border-radius:20px; border:1px solid var(--border);
  }
  .status-dot {
    width:7px; height:7px; border-radius:50%;
    background:#f59e0b; animation:pulse 2s infinite;
  }
  .status-dot.ready { background:var(--success); animation:none; }
  .status-dot.error { background:#f87171; animation:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  #chat-area {
    flex:1; overflow-y:auto; padding:24px 20px;
    display:flex; flex-direction:column; gap:16px;
    position:relative; z-index:1; scroll-behavior:smooth;
    align-items:center;
  }
  #chat-area::-webkit-scrollbar { width:4px; }
  #chat-area::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

  #welcome {
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; flex:1; gap:16px; text-align:center;
    padding:40px 20px; animation:fadeUp .5s ease;
  }
  .welcome-icon {
    width:72px; height:72px;
    background:linear-gradient(135deg,rgba(91,127,255,.2),rgba(124,157,255,.1));
    border:1px solid var(--border); border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:32px; margin-bottom:8px;
  }
  #welcome h2 { font-size:1.6rem; font-weight:700; letter-spacing:-.03em; }
  #welcome h2 span { color:var(--accent2); }
  #welcome p { color:var(--text-muted); font-size:.9rem; max-width:360px; line-height:1.6; }
  .suggestion-chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px; }
  .chip {
    background:var(--bg-input); border:1px solid var(--border);
    border-radius:20px; padding:8px 16px; font-size:.8rem;
    color:var(--text-muted); cursor:pointer; transition:all .2s;
    font-family:'Sora',sans-serif;
  }
  .chip:hover { border-color:var(--accent); color:var(--accent2); background:rgba(91,127,255,.08); }

  .message {
    display:flex; gap:10px; max-width:780px; width:100%;
    animation:fadeUp .3s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .message.user { margin-left:auto; flex-direction:row-reverse; }
  .avatar {
    width:32px; height:32px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; flex-shrink:0; margin-top:2px;
  }
  .message.ai .avatar {
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 12px rgba(91,127,255,.25);
  }
  .message.user .avatar { background:var(--bg-msg-you); border:1px solid rgba(91,127,255,.3); }
  .bubble {
    padding:12px 16px; border-radius:var(--radius);
    font-size:.88rem; line-height:1.7; max-width:calc(100% - 44px);
  }
  .message.ai .bubble {
    background:var(--bg-msg-ai); border:1px solid var(--border);
    border-top-left-radius:4px; color:var(--text);
  }
  .message.user .bubble {
    background:var(--bg-msg-you); border:1px solid rgba(91,127,255,.25);
    border-top-right-radius:4px; color:var(--text);
  }
  .sender-label {
    font-size:.7rem; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; margin-bottom:4px;
  }
  .message.ai .sender-label { color:var(--accent2); }
  .message.user .sender-label { color:var(--text-muted); text-align:right; }

  /* Markdown rendered content */
  .bubble strong { color:var(--accent2); font-weight:600; }
  .bubble em { color:var(--text-muted); font-style:italic; }
  .bubble .md-heading {
    font-size:.95rem; font-weight:700;
    color:var(--accent2); margin-bottom:10px; display:block;
  }
  .bubble .md-list {
    list-style:none; padding:0; margin:8px 0;
  }
  .bubble .md-list li {
    display:flex; gap:8px; margin:8px 0;
    line-height:1.6;
  }
  .bubble .md-list li .num {
    color:var(--accent2); font-weight:700; flex-shrink:0; min-width:18px;
  }
  .bubble .md-list li .bullet {
    color:var(--accent); flex-shrink:0;
  }
  .bubble p { margin:6px 0; }
  .bubble p:first-child { margin-top:0; }
  .bubble p:last-child { margin-bottom:0; }

  .typing-dots { display:flex; gap:4px; padding:4px 0; align-items:center; }
  .typing-dots span {
    width:6px; height:6px; background:var(--accent);
    border-radius:50%; animation:bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2){animation-delay:.2s}
  .typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

  #input-area {
    padding:16px 20px 20px;
    border-top:1px solid var(--border);
    background:rgba(13,22,40,.97);
    backdrop-filter:blur(12px);
    position:relative; z-index:10; flex-shrink:0;
  }
  .input-wrapper {
    max-width:780px; margin:0 auto;
    display:flex; align-items:flex-end; gap:10px;
    background:var(--bg-input); border:1px solid var(--border);
    border-radius:14px; padding:10px 10px 10px 16px;
    transition:border-color .2s,box-shadow .2s;
  }
  .input-wrapper:focus-within {
    border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,127,255,.1);
  }
  #user-input {
    flex:1; background:none; border:none; outline:none;
    color:var(--text); font-family:'Sora',sans-serif;
    font-size:.88rem; line-height:1.5; resize:none;
    max-height:120px; min-height:24px; overflow-y:auto;
  }
  #user-input::placeholder { color:var(--text-muted); }
  #send-btn {
    width:38px; height:38px; border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none; cursor:pointer; display:flex;
    align-items:center; justify-content:center; flex-shrink:0;
    transition:all .2s; box-shadow:0 0 12px rgba(91,127,255,.25);
  }
  #send-btn:hover { transform:scale(1.05); box-shadow:0 0 20px rgba(91,127,255,.4); }
  #send-btn:active { transform:scale(.97); }
  #send-btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  #send-btn svg { width:16px; height:16px; fill:white; }
  .input-hint {
    text-align:center; font-size:.7rem; color:var(--text-muted);
    margin-top:8px; font-family:'JetBrains Mono',monospace;
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">🎓</div>
  <div class="logo-text">MUJ <span>Chat</span></div>
  <div class="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div id="chat-area">
  <div id="welcome">
    <div class="welcome-icon">🎓</div>
    <h2>Welcome to <span>MUJ Chat</span></h2>
    <p>Your AI assistant for Manipal University Jaipur. Ask me anything about courses, admissions, campus life, and more.</p>
    <div class="suggestion-chips">
      <button class="chip" onclick="useChip(this)">📚 Course structure</button>
      <button class="chip" onclick="useChip(this)">🏛️ Admission process</button>
      <button class="chip" onclick="useChip(this)">📅 Academic calendar</button>
      <button class="chip" onclick="useChip(this)">🎓 Fee structure</button>
      <button class="chip" onclick="useChip(this)">🏠 Hostel facilities</button>
    </div>
  </div>
</div>

<div id="input-area">
  <div class="input-wrapper">
    <textarea id="user-input" placeholder="Ask anything about MUJ…" rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="input-hint">Enter to send · Shift+Enter for new line</div>
</div>

<script>
// ── REPLACE THIS with your Railway URL ────────────────────────────────────────
const API_URL = "https://ai-powered-college-faq-chatbotettparth-and-suk-production.up.railway.app";
// ─────────────────────────────────────────────────────────────────────────────

let isLoading = false;

const textarea = document.getElementById('user-input');
textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
});
textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function useChip(btn) {
  textarea.value = btn.textContent.replace(/^[^\w]+/, '').trim();
  textarea.focus();
}

function hideWelcome() {
  document.getElementById('welcome')?.remove();
}

// ── Markdown → HTML renderer ──────────────────────────────────────────────────
function renderMarkdown(text) {
  const lines = text.split('\n');
  let html = '';
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // Numbered list item: "1. **Title**: body" or "1. body"
    const numMatch = line.match(/^(\d+)\.\s+(.*)/);
    if (numMatch) {
      const content = inlineFormat(numMatch[2]);
      html += `<ul class="md-list"><li><span class="num">${numMatch[1]}.</span><span>${content}</span></li></ul>`;
      i++; continue;
    }

    // Bullet list item
    const bulletMatch = line.match(/^[-•]\s+(.*)/);
    if (bulletMatch) {
      const content = inlineFormat(bulletMatch[1]);
      html += `<ul class="md-list"><li><span class="bullet">•</span><span>${content}</span></li></ul>`;
      i++; continue;
    }

    // Blank line
    if (line.trim() === '') {
      i++; continue;
    }

    // Normal paragraph line
    html += `<p>${inlineFormat(line)}</p>`;
    i++;
  }

  return html;
}

function inlineFormat(text) {
  return text
    // Bold **text**
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // Italic *text*
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}
// ─────────────────────────────────────────────────────────────────────────────

function addMessage(role, content) {
  hideWelcome();
  const area = document.getElementById('chat-area');
  const div  = document.createElement('div');
  div.className = `message ${role}`;
  const isAI = role === 'ai';
  const rendered = isAI ? renderMarkdown(content) : content;
  div.innerHTML = `
    <div class="avatar">${isAI ? '🎓' : '👤'}</div>
    <div>
      <div class="sender-label">${isAI ? 'MUJ Chat' : 'You'}</div>
      <div class="bubble">${rendered}</div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addTyping() {
  hideWelcome();
  const area = document.getElementById('chat-area');
  const div  = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="avatar">🎓</div>
    <div>
      <div class="sender-label">MUJ Chat</div>
      <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}
function removeTyping() { document.getElementById('typing-indicator')?.remove(); }

async function sendMessage() {
  if (isLoading) return;
  const q = textarea.value.trim();
  if (!q) return;

  textarea.value = '';
  textarea.style.height = 'auto';
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  addMessage('user', q);
  addTyping();

  const ctrl = new AbortController();
  const t    = setTimeout(() => ctrl.abort(), 120000);

  try {
    const res  = await fetch(`${API_URL}/ask?question=${encodeURIComponent(q)}`, {
      method: 'POST', signal: ctrl.signal
    });
    clearTimeout(t);
    const data = await res.json();
    removeTyping();
    addMessage('ai', data.answer || 'No answer returned.');
  } catch (err) {
    clearTimeout(t);
    removeTyping();
    if (err.name === 'AbortError')
      addMessage('ai', '⏱ Request timed out. The server may be waking up — please try again in 30 seconds.');
    else
      addMessage('ai', '❌ Could not reach the server. Please try again.');
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  textarea.focus();
}

async function checkStatus() {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  try {
    const res  = await fetch(`${API_URL}/health`);
    const data = await res.json();
    if (data.status === 'loaded') {
      dot.className    = 'status-dot ready';
      text.textContent = 'Ready';
    } else {
      dot.className    = 'status-dot';
      text.textContent = 'Loading KB…';
      setTimeout(checkStatus, 3000);
    }
  } catch {
    dot.className    = 'status-dot error';
    text.textContent = 'Offline';
    setTimeout(checkStatus, 5000);
  }
}
checkStatus();
</script>
</body>
</html>
